[project]
name = "openneria"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "discord.py",
    "tortoise-orm",
    "discord-py-console",
    "langpy",
    "aiocache",
    "coloredlogs",
    "pytz",
    "aiohttp",
    "beautifulsoup4",
    "paramiko",
    "pydantic",
    "pypika-tortoise",
    "asyncpg",
    "lxml",
    "yoyo-migrations",
    "psycopg2-binary",
]

[tool.uv.sources]
discord-py-console = { git = "https://github.com/Mihitoko/discord.py-Console.git", rev = "97c2021" }
langpy = { git = "https://github.com/Mihitoko/LangPy.git", rev = "8d81d7d" }
